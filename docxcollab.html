<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema di Scansione e Generazione Documenti - Aviation Eagle</title>
    <!-- Caricamento librerie necessarie per la generazione DOCX nativa da browser -->
    <script src="https://unpkg.com/docx@8.5.0/build/index.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        :root {
            --primary-color: #1a365d;
            --secondary-color: #2b6cb0;
            --accent-color: #319795;
            --bg-color: #f7fafc;
            --card-bg: #ffffff;
            --text-color: #2d3748;
            --error-color: #e53e3e;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
        }

        h1, h2 {
            color: var(--primary-color);
            text-align: center;
        }

        /* Stato iniziale: scanner e input in ascolto */
        .scanner-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            border: 3px dashed var(--secondary-color);
            border-radius: 8px;
            background: #ebf8ff;
            transition: all 0.3s ease;
            text-align: center;
        }

        .scanner-section.active {
            border-color: var(--accent-color);
            background: #e6fffa;
        }

        .scanner-section.error {
            border-color: var(--error-color);
            background: #fff5f5;
        }

        .scanner-icon {
            font-size: 48px;
            margin-bottom: 15px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }

        .status-text {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 5px;
        }

        .error-text {
            display: none;
            color: var(--error-color);
            font-weight: bold;
            margin-top: 10px;
            font-size: 0.95rem;
        }

        .sub-text {
            font-size: 0.9rem;
            color: #718096;
            margin-bottom: 20px;
        }

        /* Input manuale del codice di sblocco */
        .input-container {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 300px;
            margin-top: 10px;
        }

        .input-container input[type="text"] {
            text-align: center;
            letter-spacing: 2px;
            font-weight: bold;
        }

        .btn-unlock {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-unlock:hover {
            background-color: var(--primary-color);
        }

        /* Seconda parte della pagina (inizialmente nascosta) */
        .config-section {
            display: none;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .scanned-info {
            background: #edf2f7;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            margin-bottom: 25px;
            border-left: 5px solid var(--secondary-color);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--primary-color);
        }

        .checkbox-group {
            display: flex;
            gap: 20px;
            margin-top: 5px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: normal;
            cursor: pointer;
        }

        .checkbox-label input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        select, input[type="text"], textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
        }

        select:focus, input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.5);
        }

        .ente-terzo-input {
            display: none;
            margin-top: 10px;
            animation: fadeIn 0.3s ease;
        }

        .btn-submit {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: var(--secondary-color);
        }

        .btn-reset {
            background-color: #e5e7eb;
            color: #374151;
            border: none;
            padding: 8px 16px;
            font-size: 0.9rem;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 20px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Console Operativa Aviation Eagle</h1>
        
        <!-- FASE 1: In attesa di Inserimento Codice / Scansione Hardware -->
        <div id="scannerSection" class="scanner-section active">
            <div id="scannerIcon" class="scanner-icon">📡</div>
            <div id="statusText" class="status-text">SISTEMA IN ASCOLTO CONSOLE</div>
            <div class="sub-text">Scansiona il codice a barre o inserisci manualmente il codice operativo per sbloccare la console</div>
            
            <!-- Casella di input inserita per digitazione manuale o input scanner focalizzato -->
            <div class="input-container">
                <input type="text" id="manualCodeInput" placeholder="Inserisci codice..." autocomplete="off">
                <button type="button" class="btn-unlock" onclick="checkManualInput()">Invia</button>
            </div>

            <div id="errorDisplay" class="error-text">CODICE NON AUTORIZZATO. ACCESSO NEGATO.</div>
        </div>

        <!-- FASE 2: Configurazione Documento DOCX -->
        <div id="configSection" class="config-section">
            <h2>Configurazione Generazione Documento</h2>
            
            <div class="scanned-info">
                Codice Scansionato (Autorizzato): <span id="codeDisplay">---</span>
            </div>

            <!-- Selezione Loghi Principali -->
            <div class="form-group">
                <label>Seleziona i loghi da inserire nell'Intestazione/Piè di pagina:</label>
                <div class="checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="logoAE" checked> Aviation Eagle
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="logoPointSky"> Point Sky
                    </label>
                </div>
            </div>

            <!-- Selezione Opzione Collaborazione / Ente Terzo -->
            <div class="form-group">
                <label for="collabOption">Tipo di Collaborazione / Intestazione Integrativa:</label>
                <select id="collabOption" onchange="toggleEnteTerzoInput()">
                    <option value="nessuna">Nessuna collaborazione aggiuntiva</option>
                    <option value="in_collaborazione_di">In collaborazione di...</option>
                    <option value="per_martedi">Per martedì</option>
                    <option value="ente_terzo">Logo Ente Terzo tramite URL</option>
                </select>
                
                <!-- Input dinamico per l'URL dell'ente terzo -->
                <div id="enteTerzoContainer" class="ente-terzo-input">
                    <label for="enteTerzoUrl">Inserisci l'URL completo del logo dell'Ente Terzo:</label>
                    <input type="text" id="enteTerzoUrl" placeholder="https://esempio.com/logo.png">
                </div>
            </div>

            <!-- Contenuto del Documento -->
            <div class="form-group">
                <label for="docContent">Contenuto della bozza documento (Corpo del testo):</label>
                <textarea id="docContent" rows="6" placeholder="Inserisci il testo o le note operative da includere nel file DOCX..."></textarea>
            </div>

            <button type="button" class="btn-submit" onclick="generateDocx()">Genera e Scarica .DOCX</button>
            <button type="button" class="btn-reset" onclick="resetScanner()">Annulla e Resetta Scanner</button>
        </div>
    </div>

    <script>
        // Configurazione e costanti di sistema
        const TARGET_CODE = "3802301747"; // Il codice hardware univoco richiesto per lo sblocco
        const LOGO_PREFIX = "https://media.aviationeagle.co.uk/";
        const LOGO_AE_FILE = "Screenshot-2025-03-06-alle-17.32.13.svg"; 
        const LOGO_POINTSKY_FILE = "Point_SkyLogo-removebg-preview.png";

        // Buffer per l'intercettazione dell'input hardware di background
        let barcodeBuffer = "";
        let lastKeyTime = Date.now();
        let scannerActive = true;
        let errorTimeout = null;

        // Metti a fuoco la casella di testo all'avvio per agevolare l'uso immediato dello scanner o della tastiera
        window.onload = function() {
            document.getElementById("manualCodeInput").focus();
        };

        // Gestione verifica per pulsante o invio da input testuale
        function checkManualInput() {
            if (!scannerActive) return;
            const inputField = document.getElementById("manualCodeInput");
            verifyScannedCode(inputField.value.trim());
        }

        // Intercettazione del tasto invio sulla casella di input testo
        document.getElementById("manualCodeInput").addEventListener("keydown", function(e) {
            if (e.key === "Enter") {
                checkManualInput();
                e.preventDefault();
            }
        });

        // Intercettazione globale dei caratteri emulati di background (qualora l'input perdesse il focus)
        window.addEventListener("keydown", function(e) {
            if (!scannerActive) return;
            if (document.activeElement === document.getElementById("manualCodeInput")) return;

            const currentTime = Date.now();
            if (currentTime - lastKeyTime > 120) {
                barcodeBuffer = "";
            }
            lastKeyTime = currentTime;

            if (e.key === "Enter") {
                if (barcodeBuffer.length > 0) {
                    verifyScannedCode(barcodeBuffer.trim());
                }
                barcodeBuffer = "";
                e.preventDefault();
                return;
            }

            if (e.key.length === 1) {
                barcodeBuffer += e.key;
            }
        });

        // Verifica la corrispondenza del codice scansionato o digitato
        function verifyScannedCode(scannedCode) {
            if (scannedCode === TARGET_CODE) { //
                // Codice corretto: Sblocco dell'interfaccia operativa
                scannerActive = false;
                clearTimeout(errorTimeout);
                document.getElementById("scannerSection").style.display = "none";
                document.getElementById("configSection").style.display = "block";
                document.getElementById("codeDisplay").innerText = scannedCode;
            } else {
                // Codice errato: Mostra un avviso visivo di errore temporaneo
                triggerScanError();
            }
        }

        // Gestione grafica del feedback in caso di codice non autorizzato
        function triggerScanError() {
            const scannerSection = document.getElementById("scannerSection");
            const statusText = document.getElementById("statusText");
            const errorDisplay = document.getElementById("errorDisplay");
            const scannerIcon = document.getElementById("scannerIcon");
            const inputField = document.getElementById("manualCodeInput");

            clearTimeout(errorTimeout);
            
            scannerSection.className = "scanner-section error";
            scannerIcon.innerText = "❌";
            statusText.innerText = "ACCESSO NEGATO";
            errorDisplay.style.display = "block";
            inputField.value = ""; // Svuota l'input errato

            // Ripristina lo stato di ascolto azzurro dopo 2.5 secondi
            errorTimeout = setTimeout(() => {
                scannerSection.className = "scanner-section active";
                scannerIcon.innerText = "📡";
                statusText.innerText = "SISTEMA IN ASCOLTO CONSOLE";
                errorDisplay.style.display = "none";
                inputField.focus();
            }, 2500);
        }

        // Funzione per il controllo visivo del campo Ente Terzo
        function toggleEnteTerzoInput() {
            const selectValue = document.getElementById("collabOption").value;
            const container = document.getElementById("enteTerzoContainer");
            container.style.display = (selectValue === "ente_terzo") ? "block" : "none";
        }

        // Resetta la console per una nuova sessione di scansione hardware
        function resetScanner() {
            scannerActive = true;
            barcodeBuffer = "";
            document.getElementById("manualCodeInput").value = "";
            document.getElementById("scannerSection").style.display = "flex";
            document.getElementById("configSection").style.display = "none";
            document.getElementById("codeDisplay").innerText = "---";
            document.getElementById("docContent").value = "";
            document.getElementById("collabOption").value = "nessuna";
            toggleEnteTerzoInput();
            setTimeout(() => { document.getElementById("manualCodeInput").focus(); }, 100);
        }

        // Funzione asincrona di core per strutturare, formattare e generare il .docx nativo
        async function generateDocx() {
            const codeScansionato = document.getElementById("codeDisplay").innerText;
            const serveAE = document.getElementById("logoAE").checked;
            const servePointSky = document.getElementById("logoPointSky").checked;
            const opzioneCollab = document.getElementById("collabOption").value;
            const enteTerzoUrl = document.getElementById("enteTerzoUrl").value;
            const testoCorpo = document.getElementById("docContent").value || "Nessun contenuto inserito nel corpo del testo.";

            let notaCollaborazione = "";
            if (opzioneCollab === "in_collaborazione_di") {
                notaCollaborazione = "In collaborazione di Aviation Eagle Network";
            } else if (opzioneCollab === "per_martedi") {
                notaCollaborazione = "Pianificazione per _____ - Documento Operativo";
            } else if (opzioneCollab === "ente_terzo" && enteTerzoUrl) {
                notaCollaborazione = `In partnership con Ente Terzo (Rif: ${enteTerzoUrl})`;
            }

            alert("Elaborazione e formattazione del file DOCX in corso...");

            let headerChildren = [
                new docx.Paragraph({
                    children: [
                        new docx.TextRun({
                            text: "AVIATION EAGLE - DOCUMENTO OPERATIVO AUTOMATIZZATO",
                            bold: true,
                            size: 20,
                            color: "1A365D"
                        })
                    ],
                    alignment: docx.AlignmentType.CENTER,
                    spacing: { after: 200 }
                })
            ];

            if (notaCollaborazione) {
                headerChildren.push(new docx.Paragraph({
                    children: [
                        new docx.TextRun({
                            text: notaCollaborazione,
                            italic: true,
                            size: 18,
                            color: "2B6CB0"
                        })
                    ],
                    alignment: docx.AlignmentType.CENTER,
                    spacing: { after: 200 }
                }));
            }

            let footerChildren = [
                new docx.Paragraph({
                    children: [
                        new docx.TextRun({
                            text: `Codice Scansione Autorizzato: ${codeScansionato} | Generato tramite Console Operativa`,
                            size: 16,
                            color: "718096"
                        })
                    ],
                    alignment: docx.AlignmentType.CENTER
                })
            ];

            const doc = new docx.Document({
                sections: [{
                    properties: {},
                    headers: { default: new docx.Header({ children: headerChildren }) },
                    footers: { default: new docx.Footer({ children: footerChildren }) },
                    children: [
                        new docx.Paragraph({
                            children: [
                                new docx.TextRun({
                                    text: "REPORT DI SCANSIONE E CONTROLLO AUTORIZZATO",
                                    bold: true,
                                    size: 32,
                                    color: "1A365D"
                                })
                            ],
                            spacing: { heading: 400, after: 300 }
                        }),
                        new docx.Paragraph({
                            children: [
                                new docx.TextRun({ text: "Verifica Token Hardware: ", bold: true }),
                                new docx.TextRun({ text: "VALIDATO (" + codeScansionato + ")", color: "319795", bold: true }),
                            ],
                            spacing: { after: 200 }
                        }),
                        new docx.Paragraph({
                            children: [
                                new docx.TextRun({ text: "Loghi Abilitati: ", bold: true }),
                                new docx.TextRun({ text: `Aviation Eagle (${serveAE ? 'SI' : 'NO'}), Point Sky (${servePointSky ? 'SI' : 'NO'})` })
                            ],
                            spacing: { after: 300 }
                        }),
                        new docx.Table({
                            rows: [
                                new docx.TableRow({
                                    children: [
                                        new docx.TableCell({
                                            children: [new docx.Paragraph({ children: [new docx.TextRun({ text: "Parametro di Controllo", bold: true, color: "FFFFFF" })] })],
                                            backgroundColor: "1A365D"
                                        }),
                                        new docx.TableCell({
                                            children: [new docx.Paragraph({ children: [new docx.TextRun({ text: "Metadato Registrato", bold: true, color: "FFFFFF" })] })],
                                            backgroundColor: "1A365D"
                                        })
                                    ]
                                }),
                                new docx.TableRow({
                                    children: [
                                        new docx.TableCell({ children: [new docx.Paragraph("Relazione Intestazione")] }),
                                        new docx.TableCell({ children: [new docx.Paragraph(opzioneCollab)] })
                                    ]
                                }),
                                new docx.TableRow({
                                    children: [
                                        new docx.TableCell({ children: [new docx.Paragraph("Percorso Loghi (Asset Network)")] }),
                                        new docx.TableCell({ children: [new docx.Paragraph(`${serveAE ? LOGO_PREFIX + LOGO_AE_FILE : ''} ${servePointSky ? LOGO_PREFIX + LOGO_POINTSKY_FILE : ''}`)] })
                                    ]
                                })
                            ],
                            width: { size: 100, type: docx.WidthType.PERCENTAGE },
                            spacing: { after: 400 }
                        }),
                        new docx.Paragraph({
                            children: [
                                new docx.TextRun({
                                    text: "CORPO DEL TESTO / NOTE DI BORDO",
                                    bold: true,
                                    size: 24,
                                    color: "2B6CB0"
                                })
                            ],
                            spacing: { before: 200, after: 150 }
                        }),
                        new docx.Paragraph({
                            children: [new docx.TextRun({ text: testoCorpo })],
                            spacing: { after: 400 },
                            lineRule: docx.LineRuleType.AT_LEAST,
                            line: 240
                        })
                    ]
                }]
            });

            docx.Packer.toBlob(doc).then((blob) => {
                saveAs(blob, `AviationEagle_Report_${codeScansionato}.docx`);
            });
        }
    </script>
</body>
</html>
