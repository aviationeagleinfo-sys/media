<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviation Eagle - Mission Control Scanner</title>
    <style>
        :root { --primary: #1a73e8; --bg: #0b1a2d; --panel-bg: #ffffff; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); color: white; text-align: center; padding: 30px 10px; margin: 0; }
        
        h1 { font-weight: 300; letter-spacing: 2px; margin-bottom: 30px; color: #e0e0e0; }
        
        .main-container { max-width: 500px; margin: auto; }

        .scan-area { 
            background: rgba(255, 255, 255, 0.05); 
            padding: 30px; 
            border-radius: 20px; 
            border: 1px solid rgba(26, 115, 232, 0.3); 
            margin-bottom: 20px;
        }

        /* Area di Input Visibile */
        .input-group { margin-top: 15px; }
        label { display: block; margin-bottom: 10px; font-size: 0.9em; color: #1a73e8; text-transform: uppercase; font-weight: bold; }
        
        #inputScanner { 
            width: 80%; 
            padding: 15px; 
            font-size: 1.2em; 
            border-radius: 10px; 
            border: 2px solid var(--primary); 
            background: #f0f7ff; 
            color: #333; 
            text-align: center;
            font-family: 'Courier New', monospace;
            box-shadow: 0 0 15px rgba(26, 115, 232, 0.2);
        }

        #inputScanner:focus { outline: none; background: #fff; box-shadow: 0 0 20px rgba(26, 115, 232, 0.4); }

        .panel { 
            display: none; 
            background: var(--panel-bg); 
            color: #333; 
            padding: 30px; 
            border-radius: 20px; 
            text-align: left; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.6); 
            animation: slideIn 0.4s ease-out;
        }

        .data-label { font-size: 0.8em; color: #888; text-transform: uppercase; margin-bottom: 2px; }
        .data-val { font-weight: bold; color: var(--primary); font-size: 1.5em; margin-bottom: 15px; display: block; }
        
        .chiamata-box { background: #e8f0fe; padding: 10px 20px; border-radius: 10px; display: inline-block; border: 1px solid var(--primary); }

        .btn { width: 100%; padding: 16px; margin-top: 10px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 1em; transition: 0.3s; }
        .btn-blue { background: var(--primary); color: white; }
        .btn-blue:hover { opacity: 0.9; transform: translateY(-2px); }
        .btn-reset { background: #f1f3f4; color: #5f6368; }

        @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="main-container">
        <h1>GATE OPERATIVO</h1>

        <div class="scan-area" id="scanArea">
            <div class="input-group">
                <label for="inputScanner">Pronto per Scansione QR</label>
                <input type="text" id="inputScanner" placeholder="Punta lo scanner qui..." autofocus>
            </div>
            <p id="msg" style="margin-top: 20px; font-size: 0.9em; color: #1a73e8;">In attesa di dati...</p>
        </div>

        <div id="dataPanel" class="panel">
            <div style="text-align: center; margin-bottom: 20px;">
                <span class="chiamata-box">
                    <span class="data-label">Chiamata:</span>
                    <span id="outChiamata" style="font-size: 2.5em; font-weight: 900; color: var(--primary); display: block;"></span>
                </span>
            </div>
            
            <span class="data-label">Passeggero:</span>
            <span id="outNome" class="data-val"></span>

            <span class="data-label">ID Sessione:</span>
            <span id="outID" style="color: #666; font-family: monospace;"></span>
            
            <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
            
            <button class="btn btn-blue" onclick="creaLog()">GENERA LOG MISSIONE</button>
            <button class="btn btn-reset" onclick="resetGate()">CHIUDI E PROSSIMO</button>
        </div>
    </div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwLNQAXxWoVqFhkg0nMVN9mR2YixrQQyZAloSJ3WcWVGxKYJsaQRZG_7dpDLjIcI7dGvg/exec";
    const inputScanner = document.getElementById('inputScanner');

    // Mantiene il focus sul campo quando l'utente clicca fuori
    document.body.addEventListener('click', () => inputScanner.focus());

    // Gestione input dello scanner
    // Gestione input dello scanner con correzione carattere
    inputScanner.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            // Sostituisce l'apice ' con il trattino - e pulisce il codice
            let code = inputScanner.value.replace(/'/g, "-").trim().toUpperCase();
            
            if (code) {
                fetchData(code);
            }
            inputScanner.value = ''; // Pulisce il campo per la prossima scansione
        }
    });

    async function fetchData(id) {
        document.getElementById('msg').innerText = "IDENTIFICAZIONE: " + id;
        document.getElementById('msg').style.color = "#ff9800";
        
        try {
            const response = await fetch(`${WEB_APP_URL}?action=getData&id=${id}`);
            const data = await response.json();
            
            if(data.error) {
                document.getElementById('msg').innerText = "ERRORE: Codice non trovato.";
                document.getElementById('msg').style.color = "#f44336";
                return;
            }

            // Popola i dati
            document.getElementById('outNome').innerText = data.nome + " " + data.cognome;
            document.getElementById('outChiamata').innerText = data.chiamata;
            document.getElementById('outID').innerText = data.id;
            
            // Gestione UI
            document.getElementById('scanArea').style.display = 'none';
            document.getElementById('dataPanel').style.display = 'block';
        } catch(e) {
            alert("Errore di rete. Verifica la connessione.");
        }
    }

    async function creaLog() {
        const id = document.getElementById('outID').innerText;
        alert("Generazione report missione in corso...");
        try {
            const res = await fetch(`${WEB_APP_URL}?action=createDoc&id=${id}`);
            const text = await res.text();
            alert("Rapporto creato correttamente su Google Drive.");
        } catch(e) {
            alert("Errore nella creazione del documento.");
        }
    }

    function resetGate() {
        document.getElementById('dataPanel').style.display = 'none';
        document.getElementById('scanArea').style.display = 'block';
        document.getElementById('msg').innerText = "SISTEMA PRONTO";
        document.getElementById('msg').style.color = "#1a73e8";
        inputScanner.value = '';
        inputScanner.focus();
    }
</script>
</body>
</html>
