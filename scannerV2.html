<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviation Eagle | Infopoint Terminal</title>
    <style>
        :root {
            --bg: #030708;
            --panel: #0a1118;
            --accent: #1a73e8;
            --gold: #c5a021;
            --text-main: #e2e8f0;
            --text-dim: #64748b;
        }

        body, html { 
            margin: 0; padding: 0; height: 100%; 
            background: var(--bg); color: var(--text-main);
            font-family: 'Inter', 'Segoe UI', sans-serif; overflow: hidden;
        }

        #scannerGhost { position: absolute; opacity: 0; pointer-events: none; top: -100px; }

        .step {
            display: none; height: 100vh; width: 100vw;
            flex-direction: column; align-items: center; justify-content: center;
        }

        .active { display: flex; animation: fadeIn 0.4s ease-in-out; }

        /* RADAR */
        .radar {
            width: 180px; height: 180px; border: 1px solid var(--accent); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; position: relative;
        }
        .radar::after {
            content: ""; width: 100%; height: 100%; border-radius: 50%;
            border: 2px solid var(--accent); position: absolute; animation: pulse 2s infinite;
        }

        .profile-container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 20px; }
        .info-block { border-left: 4px solid var(--accent); padding-left: 20px; }
        .label { font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 2px; }
        .value { font-size: 1.8rem; font-weight: 700; display: block; }

        .callsign-box {
            background: rgba(26, 115, 232, 0.05); padding: 20px; border-radius: 15px; 
            text-align: center; border: 1px solid rgba(26, 115, 232, 0.2);
        }
        .callsign-value { font-size: 5rem; font-weight: 900; color: var(--accent); line-height: 1; }

        /* HUB & FORM */
        .doc-hub { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 90%; max-width: 700px; }
        .doc-card {
            background: var(--panel); border: 1px solid rgba(255,255,255,0.05);
            padding: 25px; border-radius: 12px; cursor: pointer; transition: 0.3s; text-align: center;
        }
        .doc-card:hover { border-color: var(--accent); background: #111b27; }

        #compilationForm {
            width: 90%; max-width: 600px; background: var(--panel); 
            padding: 30px; border-radius: 20px; border: 1px solid var(--accent);
            display: none; flex-direction: column; gap: 20px;
        }
        
        textarea {
            background: #000; border: 1px solid #333; color: white; padding: 15px;
            border-radius: 10px; font-family: sans-serif; resize: none; font-size: 1rem;
            outline: none;
        }

        .btn-nav {
            padding: 12px 30px; background: none; border: 1px solid #333;
            color: #888; cursor: pointer; border-radius: 50px; font-weight: bold;
        }
        .btn-nav:hover { border-color: white; color: white; }
        .btn-send { background: var(--accent); color: white; border: none; }

        @keyframes pulse { 0% { transform: scale(1); opacity: 0.6; } 100% { transform: scale(1.3); opacity: 0; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        #loader { display: none; color: var(--accent); text-align: center; font-weight: bold; }
    </style>
</head>
<body>

    <input type="text" id="scannerGhost" autocomplete="off">

    <!-- STEP 1: ATTESA -->
    <div id="step1" class="step active">
        <div class="radar"><span style="letter-spacing: 3px; font-size: 0.6rem; color: var(--accent);">WAITING SCAN</span></div>
        <p style="margin-top: 20px; color: var(--text-dim);">TERMINALE PRONTO PER COLONNA F</p>
    </div>

    <!-- STEP 2: DATI -->
    <div id="step2" class="step">
        <div class="profile-container">
            <div class="info-block">
                <span class="label">Passeggero Identificato</span>
                <span id="outNome" class="value">---</span>
            </div>
            <div class="callsign-box">
                <span class="label">Numero Chiamata (Col G)</span>
                <div id="outChiamata" class="callsign-value">--</div>
            </div>
        </div>
        <div style="display: flex; gap: 15px; margin-top: 30px;">
            <button class="btn-nav" onclick="changeStep(1)">ANNULLA</button>
            <button class="btn-nav" style="border-color: var(--accent); color: var(--accent);" onclick="changeStep(3)">PROCEDI →</button>
        </div>
    </div>

    <!-- STEP 3: SERVIZI -->
    <div id="step3" class="step">
        <div id="selectionGrid" style="display: contents;">
            <h2 style="margin-bottom: 30px; letter-spacing: 2px;">REPORT HUB</h2>
            <div class="doc-hub">
                <div class="doc-card" onclick="openEditor('Point&Sky')"><h3>Point&Sky</h3></div>
                <div class="doc-card" onclick="openEditor('Voli')"><h3>Richiesta Voli</h3></div>
                <div class="doc-card" onclick="openEditor('Info')"><h3>Info Point</h3></div>
                <div class="doc-card" onclick="openEditor('Custom')"><h3>Altro</h3></div>
            </div>
            <button class="btn-nav" onclick="changeStep(1)" style="margin-top: 30px;">CHIUDI SESSIONE</button>
        </div>

        <div id="compilationForm">
            <h3 id="formTitle" style="color: var(--accent); margin: 0;">EDITOR</h3>
            <textarea id="noteMissione" rows="6" placeholder="Dettagli missione..."></textarea>
            <div id="loader">TRASMISSIONE IN CORSO...</div>
            <div style="display: flex; gap: 10px; justify-content: flex-end;">
                <button class="btn-nav" onclick="closeEditor()">INDIETRO</button>
                <button class="btn-send btn-nav" onclick="generateProfessionalDoc()">INVIA</button>
            </div>
        </div>
    </div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzTEuKcWbk5igOEANcxHmzmagWR4EEmMH9upVthE4wZrDTsGFz-j6k8wwHHdeY5BWtwYQ/exec";
    const ghost = document.getElementById('scannerGhost');
    let currentClientID = "";
    let isEditorOpen = false;

    function forceFocus() { if (!isEditorOpen) ghost.focus(); }
    setInterval(forceFocus, 500);

    ghost.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            const cleanCode = ghost.value.trim().toUpperCase();
            if(cleanCode) identifyClient(cleanCode);
            ghost.value = '';
        }
    });

    async function identifyClient(id) {
        try {
            // Invio ID pulito per ricerca in colonna F
            const response = await fetch(`${API_URL}?action=getData&id=${encodeURIComponent(id)}`);
            const data = await response.json();
            
            if(data.error) {
                alert("SISTEMA: ID [" + id + "] non trovato in Colonna F.");
                return;
            }

            currentClientID = id;
            // Assicurati che Nome e Cognome siano nelle colonne corrette mappate nello script
            document.getElementById('outNome').innerText = (data.Nome + " " + data.Cognome).toUpperCase();
            
            // Forza lettura Colonna G (Chiamata)
            document.getElementById('outChiamata').innerText = data.Chiamata || data.CHIAMATA || "--";
            
            changeStep(2);
        } catch(err) { alert("ERRORE DI COMUNICAZIONE DATABASE."); }
    }

    function changeStep(n) {
        document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
        document.getElementById('step' + n).classList.add('active');
        if(n !== 3) isEditorOpen = false;
    }

    function openEditor(type) {
        isEditorOpen = true;
        selectedType = type;
        document.getElementById('selectionGrid').style.display = 'none';
        document.getElementById('compilationForm').style.display = 'flex';
        document.getElementById('formTitle').innerText = "REPORT: " + type.toUpperCase();
        setTimeout(() => document.getElementById('noteMissione').focus(), 150);
    }

    function closeEditor() {
        isEditorOpen = false;
        document.getElementById('selectionGrid').style.display = 'contents';
        document.getElementById('compilationForm').style.display = 'none';
    }

    async function generateProfessionalDoc() {
        const note = document.getElementById('noteMissione').value;
        if(!note) { alert("Inserire dettagli."); return; }
        document.getElementById('loader').style.display = 'block';
        
        try {
            const res = await fetch(`${API_URL}?action=submitForm&idSessione=${encodeURIComponent(currentClientID)}&tipoServizio=${encodeURIComponent(selectedType)}&noteMissione=${encodeURIComponent(note)}`);
            const data = await res.json();
            if(data.status === 'success') {
                alert("MISSIONE COMPIUTA.");
                changeStep(1);
            }
        } catch (err) { alert("ERRORE INVIO."); }
        finally { document.getElementById('loader').style.display = 'none'; }
    }
</script>
</body>
</html>
