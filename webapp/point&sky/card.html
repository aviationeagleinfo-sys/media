<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Point&Sky | Aviation Eagle</title>
    <link rel="icon" type="image/png" href="favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Animazioni personalizzate */
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans selection:bg-blue-200">

    <header class="bg-[#0b1b3d] shadow-md border-b border-blue-900 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center space-x-4">
                <img src="https://media.aviationeagle.co.uk/Aviation-Eagle-Compact-TM-RBG.png" alt="Aviation Eagle Logo" class="w-12 h-12 object-contain bg-white rounded-full p-1">
                <img src="https://media.aviationeagle.co.uk/Point&SkyLogo.png" alt="Point&Sky Logo" class="h-10 object-contain">
            </div>
            <div class="flex items-center space-x-4">
                <img src="https://media.aviationeagle.co.uk/Aviation-Eagle-Slogan-ITA.png" alt="Slogan" class="h-6 hidden md:block opacity-80">
                <span id="status-badge" class="text-xs font-semibold px-3 py-1.5 rounded-full bg-blue-900 text-blue-200 border border-blue-700">Sistema Pronto</span>
                <button id="btn-global-reset" class="text-xs bg-blue-800 hover:bg-blue-700 text-white font-medium px-3 py-1.5 rounded-md transition duration-200">🔄 Reset Portale</button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8">
        <section id="search-section" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-6 transition-all hover:shadow-md">
            <h2 class="text-lg font-bold mb-4 text-[#0b1b3d]">✈️ Accedi al tuo Profilo Point&Sky</h2>
            <div class="flex flex-col sm:flex-row gap-3">
                <input type="text" id="input-codice" placeholder="Inserisci Numero Tessera..." class="flex-1 px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-600 outline-none text-lg tracking-wider">
                <button id="btn-accedi" class="bg-[#0b1b3d] hover:bg-blue-800 text-white font-bold px-8 py-3 rounded-xl transition duration-200 shadow-sm">Verifica</button>
            </div>
            <p id="search-error" class="text-red-600 text-sm mt-3 hidden font-medium"></p>
        </section>

        <section id="user-dashboard" class="hidden space-y-6 fade-in">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between gap-6 relative overflow-hidden">
                <div class="absolute top-0 right-0 w-32 h-32 bg-blue-50 rounded-bl-full -z-0 opacity-50"></div>
                
                <div class="relative z-10">
                    <p class="text-xs text-slate-500 font-bold uppercase tracking-widest mb-1">Tessera N° <span id="usr-tessera" class="text-blue-600 text-sm"></span></p>
                    <h2 class="text-3xl font-extrabold text-[#0b1b3d]" id="usr-nominativo">Nome Cognome</h2>
                    
                    <div class="mt-4 flex flex-col gap-1 text-sm text-slate-600">
                        <p>📧 <span id="usr-email" class="font-medium"></span></p>
                        <p>📱 <span id="usr-telefono" class="font-medium"></span></p>
                    </div>
                </div>

                <div class="relative z-10 flex flex-col items-end justify-center min-w-[200px]">
                    <div class="text-right bg-slate-50 p-4 rounded-xl border border-slate-100 w-full shadow-inner">
                        <p class="text-xs text-slate-400 font-bold uppercase tracking-wider mb-1">Saldo Punti Aeros</p>
                        <p id="usr-punti" class="text-3xl font-black text-[#0b1b3d]">0</p>
                    </div>
                </div>
            </div>

            <div id="grade-card" class="p-6 rounded-2xl shadow-sm border flex flex-col gap-4">
                <div class="flex items-center justify-between border-b border-current pb-4 opacity-90">
                    <div>
                        <p class="text-sm font-bold uppercase tracking-wider opacity-80">Livello Attuale</p>
                        <h3 class="text-4xl font-black mt-1 tracking-tight" id="usr-grado-nome">Bronze</h3>
                    </div>
                    <div class="text-5xl" id="usr-grado-icona">🟢</div>
                </div>
                
                <div class="pt-2">
                    <h4 class="font-bold text-lg mb-3 opacity-90">I tuoi Vantaggi Esclusivi:</h4>
                    <ul id="usr-vantaggi-lista" class="space-y-2 text-sm md:text-base font-medium opacity-90">
                        </ul>
                </div>
            </div>
        </section>

        <section id="admin-panel" class="hidden bg-white p-6 rounded-2xl shadow-sm border border-blue-200 space-y-6 fade-in ring-2 ring-blue-500 ring-opacity-20">
            <div class="border-b border-slate-100 pb-4">
                <h2 class="text-xl font-black text-[#0b1b3d]">🛡️ Terminale Operativo Amministrativo</h2>
                <p class="text-xs text-slate-500 mt-1">Cerca, inizializza o modifica le informazioni dei membri Point&Sky.</p>
            </div>

            <div class="flex flex-col sm:flex-row gap-3 bg-blue-50/50 p-4 rounded-xl border border-blue-100">
                <input type="text" id="admin-target-code" placeholder="Numero Tessera da gestire..." class="flex-1 px-4 py-2 border border-blue-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-600 text-sm font-mono">
                <button id="btn-admin-load" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold px-6 py-2 rounded-xl transition duration-200 shadow-sm">Carica Scheda</button>
            </div>

            <div id="admin-form-container" class="opacity-50 pointer-events-none transition-all duration-300 space-y-5">
                <h3 id="admin-form-title" class="text-sm font-bold text-slate-700 bg-slate-100 inline-block px-3 py-1 rounded-md">Dati sul Database</h3>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1 uppercase tracking-wider">Nome</label>
                        <input type="text" id="adm-nome" class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500 bg-slate-50 focus:bg-white">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1 uppercase tracking-wider">Cognome</label>
                        <input type="text" id="adm-cognome" class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500 bg-slate-50 focus:bg-white">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1 uppercase tracking-wider">Email</label>
                        <input type="email" id="adm-email" class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500 bg-slate-50 focus:bg-white">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1 uppercase tracking-wider">Telefono</label>
                        <input type="text" id="adm-telefono" class="w-full px-3 py-2.5 border border-slate-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500 bg-slate-50 focus:bg-white">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-[#0b1b3d] mb-1 uppercase tracking-wider">Saldo Punti (Aeros)</label>
                        <input type="number" id="adm-punti" class="w-full px-3 py-2.5 border-2 border-blue-200 rounded-xl text-lg font-bold outline-none focus:ring-2 focus:ring-blue-500 bg-blue-50">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-[#0b1b3d] mb-1 uppercase tracking-wider">Assegnazione Grado</label>
                        <select id="adm-grado" class="w-full px-3 py-2.5 border-2 border-blue-200 rounded-xl text-sm font-bold bg-white outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer">
                            <option value="Bronze">🟢 Bronze</option>
                            <option value="Iron">🟢 Iron</option>
                            <option value="Silver">🔵 Silver</option>
                            <option value="Gold">🔵 Gold</option>
                            <option value="Emerald">💎 Emerald</option>
                            <option value="Platinum">💎 Platinum</option>
                            <option value="Diamond">👑 Diamond</option>
                        </select>
                    </div>
                </div>

                <div class="pt-4 border-t border-slate-100">
                    <button id="btn-action-save" class="w-full bg-[#0b1b3d] hover:bg-blue-900 text-white text-base font-bold py-3 rounded-xl transition duration-200 shadow-md">💾 Salva Profilo Utente</button>
                </div>
            </div>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDB858lvuIi93dYBUmviH87jrb8dHZxm1s",
            authDomain: "giuseppe-rtdb.firebaseapp.com",
            databaseURL: "https://giuseppe-rtdb-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "giuseppe-rtdb",
            storageBucket: "giuseppe-rtdb.firebasestorage.app",
            messagingSenderId: "409034640682",
            appId: "1:409034640682:web:b183a9b69b4b51e5e8e253"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const FIRESTORE_COLLECTION = "membri_pointandsky";
        const ADMIN_MASTER_CODE = "3802301747";

        // Struttura Dati Gradi e Colori
        const LIVELLI = {
            "Bronze": {
                icona: "🟢",
                tema: "bg-[#cd7f32] text-white border-[#8b5a2b]",
                vantaggi: [
                    "Accumulo punti attivo su ogni ricerca."
                ]
            },
            "Iron": {
                icona: "🟢",
                tema: "bg-slate-600 text-white border-slate-800",
                vantaggi: [
                    "Accumulo punti attivo su ogni ricerca.",
                    "Sconto del 5% sui prodotti."
                ]
            },
            "Silver": {
                icona: "🔵",
                tema: "bg-slate-200 text-slate-800 border-slate-400",
                vantaggi: [
                    "Accumulo punti attivo.",
                    "Sconto del 5% sui prodotti.",
                    "Risposta prioritaria dal supporto tecnico.",
                    "Badge Account Verificato disponibile su richiesta (400 Aeros/mese)."
                ]
            },
            "Gold": {
                icona: "🔵",
                tema: "bg-yellow-500 text-slate-900 border-yellow-600",
                vantaggi: [
                    "Accumulo punti attivo.",
                    "Sconto del 10% su tutto il catalogo (Prodotti e Servizi).",
                    "Assistenza Prioritaria.",
                    "Piano Silver Mensile GRATUITO.",
                    "Badge Account Verificato GRATUITO."
                ]
            },
            "Emerald": {
                icona: "💎",
                tema: "bg-emerald-600 text-white border-emerald-800",
                vantaggi: [
                    "Accumulo punti attivo.",
                    "Sconto del 12% su tutto il catalogo.",
                    "Sconto del 5% sulle Gift Card.",
                    "Assistenza Prioritaria + Piano Silver Annuale GRATUITO.",
                    "Badge Account Verificato GRATIS.",
                    "Richiesta Badge 'Aviation Native' (800 Aeros/mese)."
                ]
            },
            "Platinum": {
                icona: "💎",
                tema: "bg-zinc-200 text-zinc-900 border-zinc-400 shadow-md",
                vantaggi: [
                    "Accumulo punti attivo.",
                    "Sconto del 15% su tutto il catalogo.",
                    "Sconto del 7% sulle Gift Card.",
                    "Assistenza Prioritaria + Piano Silver Annuale GRATUITO.",
                    "Badge Account Verificato + Badge 'Aviation Native' GRATUITI.",
                    "Special Ops: Richiesta Badge 'Eagle One' (1000 Aeros/mese) | Upgrade a Eagle One (100 Aeros una tantum)."
                ]
            },
            "Diamond": {
                icona: "👑",
                tema: "bg-cyan-100 text-cyan-900 border-cyan-400 shadow-lg",
                vantaggi: [
                    "Accumulo punti attivo.",
                    "Sconto del 15% su tutto il catalogo.",
                    "Sconto del 7% sulle Gift Card.",
                    "Assistenza Prioritaria + Piano Silver Annuale GRATUITO.",
                    "TUTTI I BADGE GRATUITI (Verificato, Aviation Native, Eagle One).",
                    "Special Ops: Passaggio da Aviation Native a Eagle One Gratuito."
                ]
            }
        };

        // Riferimenti DOM
        const inputCodice = document.getElementById('input-codice');
        const btnAccedi = document.getElementById('btn-accedi');
        const searchError = document.getElementById('search-error');
        const statusBadge = document.getElementById('status-badge');
        const btnGlobalReset = document.getElementById('btn-global-reset');

        const userDashboard = document.getElementById('user-dashboard');
        const usrNominativo = document.getElementById('usr-nominativo');
        const usrEmail = document.getElementById('usr-email');
        const usrTelefono = document.getElementById('usr-telefono');
        const usrTessera = document.getElementById('usr-tessera');
        const usrPunti = document.getElementById('usr-punti');
        const gradeCard = document.getElementById('grade-card');
        const usrGradoNome = document.getElementById('usr-grado-nome');
        const usrGradoIcona = document.getElementById('usr-grado-icona');
        const usrVantaggiLista = document.getElementById('usr-vantaggi-lista');

        const adminPanel = document.getElementById('admin-panel');
        const adminTargetCode = document.getElementById('admin-target-code');
        const btnAdminLoad = document.getElementById('btn-admin-load');
        const adminFormContainer = document.getElementById('admin-form-container');
        const adminFormTitle = document.getElementById('admin-form-title');
        
        const admNome = document.getElementById('adm-nome');
        const admCognome = document.getElementById('adm-cognome');
        const admEmail = document.getElementById('adm-email');
        const admTelefono = document.getElementById('adm-telefono');
        const admPunti = document.getElementById('adm-punti');
        const admGrado = document.getElementById('adm-grado');
        const btnActionSave = document.getElementById('btn-action-save');

        let adminActiveTargetCode = null;

        function resetSchermata() {
            adminActiveTargetCode = null;
            inputCodice.value = "";
            searchError.classList.add('hidden');
            
            statusBadge.textContent = "Sistema Pronto";
            statusBadge.className = "text-xs font-semibold px-3 py-1.5 rounded-full bg-blue-900 text-blue-200 border border-blue-700";
            
            userDashboard.classList.add('hidden');
            adminPanel.classList.add('hidden');
            
            adminTargetCode.value = "";
            adminFormContainer.classList.add('opacity-50', 'pointer-events-none');
            adminFormTitle.innerHTML = "Dati sul Database";
            admNome.value = ""; admCognome.value = ""; admEmail.value = ""; admTelefono.value = "";
            admPunti.value = "0"; admGrado.value = "Bronze";
        }

        btnGlobalReset.addEventListener('click', resetSchermata);

        // --- ACCESSO UTENTE / ADMIN ---
        // --- ACCESSO DINAMICO (VERIFICA ADMIN NEL DATABASE) ---
        btnAccedi.addEventListener('click', async () => {
            const codice = inputCodice.value.trim();
            searchError.classList.add('hidden');
            
            if (!codice) {
                mostraErrore("Inserisci un numero tessera valido.");
                return;
            }

            statusBadge.textContent = "Verifica in corso...";
            
            try {
                const docRef = doc(db, FIRESTORE_COLLECTION, codice);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();

                    // CONTROLLO PRIVILEGI ADMIN
                    if (data.admin === true) {
                        statusBadge.textContent = "Modalità Admin Attiva";
                        statusBadge.className = "text-xs font-bold px-3 py-1.5 rounded-full bg-red-100 text-red-700 border border-red-300";
                        adminPanel.classList.remove('hidden');
                        userDashboard.classList.add('hidden');
                        inputCodice.value = "";
                    } else {
                        // NORMALE UTENTE
                        renderUserDashboard(data, codice);
                        statusBadge.textContent = "Tessera Verificata";
                        statusBadge.className = "text-xs font-semibold px-3 py-1.5 rounded-full bg-emerald-100 text-emerald-800 border border-emerald-300";
                    }
                } else {
                    mostraErrore("Nessuna tessera trovata.");
                    userDashboard.classList.add('hidden');
                }
            } catch (error) {
                console.error(error);
                mostraErrore("Errore di connessione.");
            }
        });

        function mostraErrore(msg) {
            searchError.textContent = msg;
            searchError.classList.remove('hidden');
            statusBadge.textContent = "Errore Ricerca";
            statusBadge.className = "text-xs font-semibold px-3 py-1.5 rounded-full bg-red-100 text-red-800 border border-red-300";
        }

        function renderUserDashboard(data, tesseraId) {
            userDashboard.classList.remove('hidden');
            adminPanel.classList.add('hidden');

            usrNominativo.textContent = `${data.nome || ""} ${data.cognome || ""}`.trim() || "Utente Sconosciuto";
            usrEmail.textContent = data.email || "Nessuna email registrata";
            usrTelefono.textContent = data.telefono || "Nessun telefono registrato";
            usrTessera.textContent = tesseraId;
            usrPunti.textContent = (data.punti || 0).toLocaleString('it-IT');

            const grado = data.grado || "Bronze";
            const infoGrado = LIVELLI[grado] || LIVELLI["Bronze"];

            usrGradoNome.textContent = grado;
            usrGradoIcona.textContent = infoGrado.icona;
            
            // Applica stili dinamici alla carta
            gradeCard.className = `p-6 rounded-2xl border flex flex-col gap-4 transition-all duration-500 ${infoGrado.tema}`;

            // Genera lista vantaggi
            usrVantaggiLista.innerHTML = "";
            infoGrado.vantaggi.forEach(vantaggio => {
                usrVantaggiLista.innerHTML += `<li class="flex items-start gap-2"><span class="mt-0.5">✓</span> <span>${vantaggio}</span></li>`;
            });
        }

        // --- GESTIONE AMMINISTRATORE ---
        btnAdminLoad.addEventListener('click', async () => {
            const targetCode = adminTargetCode.value.trim();
            if (!targetCode) {
                alert("Inserisci un numero tessera valido da gestire.");
                return;
            }

            adminActiveTargetCode = targetCode;
            adminFormContainer.classList.remove('opacity-50', 'pointer-events-none');

            try {
                const docRef = doc(db, FIRESTORE_COLLECTION, targetCode);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    adminFormTitle.innerHTML = `⚙️ Modifica Tessera: <span class="text-blue-700 font-mono font-black">${targetCode}</span>`;
                    admNome.value = data.nome || "";
                    admCognome.value = data.cognome || "";
                    admEmail.value = data.email || "";
                    admTelefono.value = data.telefono || "";
                    admPunti.value = data.punti || 0;
                    admGrado.value = data.grado || "Bronze";
                } else {
                    adminFormTitle.innerHTML = `🆕 Registrazione Nuova Tessera: <span class="text-emerald-600 font-mono font-black">${targetCode}</span>`;
                    admNome.value = ""; admCognome.value = ""; admEmail.value = ""; admTelefono.value = "";
                    admPunti.value = 0; admGrado.value = "Bronze";
                }
            } catch (e) {
                alert("Impossibile connettersi al documento.");
            }
        });

        btnActionSave.addEventListener('click', async () => {
            if (!adminActiveTargetCode) return;

            const docRef = doc(db, FIRESTORE_COLLECTION, adminActiveTargetCode);

            try {
                await setDoc(docRef, {
                    nome: admNome.value.trim(),
                    cognome: admCognome.value.trim(),
                    email: admEmail.value.trim(),
                    telefono: admTelefono.value.trim(),
                    punti: parseInt(admPunti.value) || 0,
                    grado: admGrado.value
                }, { merge: true });

                alert(`Dati per la tessera ${adminActiveTargetCode} salvati correttamente!`);
                resetSchermata();

            } catch (error) {
                console.error(error);
                alert("Errore critico durante il salvataggio dei dati.");
            }
        });
    </script>
</body>
</html>
