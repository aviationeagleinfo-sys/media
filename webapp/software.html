<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aviation Eagle WebApp</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Healthcare">
    <link rel="apple-touch-icon" href="https://media.aviationeagle.co.uk/favicon.ico">

    <meta name="application-name" content="Healthcare">
    <meta name="msapplication-TileImage" content="https://media.aviationeagle.co.uk/favicon.ico">
    <meta name="msapplication-TileColor" content="#ffffff">

    <link rel="icon" href="https://webapp.drgiuseppemusumeci.com/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="https://webapp.drgiuseppemusumeci.com/favicon.ico" type="image/x-icon">

    <style>
        :root {
            --primary-color: #0056b3;
            --hover-color: #003d82;
            --bg-color: #f4f7f9;
            --text-color: #333333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            color: var(--primary-color);
            margin: 0;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .button-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            width: 100%;
            max-width: 400px;
        }

        /* Layout a due colonne per schermi più grandi (Mac/PC/Tablet) */
        @media (min-width: 600px) {
            .button-container {
                grid-template-columns: 1fr 1fr;
                max-width: 600px;
            }
        }

        a.button {
            background-color: var(--primary-color);
            color: white;
            text-decoration: none;
            padding: 20px;
            border-radius: 14px;
            text-align: center;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 6px rgba(0, 86, 179, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 80px;
            /* Previene la selezione del testo nei bottoni */
            user-select: none;
            -webkit-user-select: none;
        }

        a.button:hover {
            background-color: var(--hover-color);
            box-shadow: 0 6px 12px rgba(0, 86, 179, 0.25);
            transform: translateY(-2px);
        }

        a.button:active {
            transform: translateY(0);
            box-shadow: 0 2px 4px rgba(0, 86, 179, 0.1);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Gestione Aviation Eagle</h1>
    </div>

    <div class="button-container">
        <a href="https://media.aviationeagle.co.uk/docxcollab" class="button">DOCX</a>
        <a href="https://media.aviationeagle.co.uk/webapp/business" class="button">BUSINESS</a>
        <a href="https://media.aviationeagle.co.uk/webapp/point&sky/card" class="button">CARD GENERATOR</a>
        <a href="https://media.aviationeagle.co.uk/webapp/point&sky/badge" class="button">BADGE</a>
        <a href="https://media.aviationeagle.co.uk/webapp/point&sky/standard-badge" class="button">STANDARD BADGE</a>
        <a href="https://media.aviationeagle.co.uk/scannerV2" class="button">SCANNER</a>
        <a href="https://media.aviationeagle.co.uk/check-in" class="button">CHECK-IN</a>
         
    </div>

</body>
</html>
